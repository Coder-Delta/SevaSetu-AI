services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sevasetu
      POSTGRES_PASSWORD: sevasetu_dev
      POSTGRES_DB: sevasetu
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    restart: always

volumes:
  postgres_data:
  minio_data:
